<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Preview Card 1200×630</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff5f9; }
  .stage {
    width: 1200px;
    height: 630px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(var(--s, 1));
  }
  .stage {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: linear-gradient(125deg, #fff5f9 0%, #ffe6f1 40%, #f3e8ff 75%, #ffe1d4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .g1 { width: 460px; height: 460px; background: #ffb3d3; opacity: .55; top: -150px; left: -100px; }
  .g2 { width: 420px; height: 420px; background: #c9a7ff; opacity: .45; bottom: -180px; right: -80px; }
  .card {
    position: relative;
    width: 1010px;
    padding: 52px 58px;
    border-radius: 40px;
    background: rgba(255,255,255,.85);
    border: 2px solid #ffd0e4;
    box-shadow: 0 30px 80px rgba(227,75,141,.22);
  }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .mark {
    width: 60px; height: 60px; border-radius: 20px;
    background: linear-gradient(135deg, #ff8fc0, #e34b8d 60%, #b06cff);
    color: #fff; font-size: 31px; font-weight: 700;
    display: grid; place-items: center;
    transform: rotate(-4deg);
    box-shadow: 0 10px 24px rgba(227,75,141,.35);
  }
  .brand-text { font-size: 33px; font-weight: 700; color: #4a2b3c; letter-spacing: -.02em; }
  .brand-text em { font-style: normal; color: #f96ba8; }
  h1 { font-size: 56px; line-height: 1.12; color: #4a2b3c; letter-spacing: -.035em; margin-bottom: 14px; }
  h1 span { color: #e34b8d; }
  p { font-size: 23px; color: #8a6478; line-height: 1.5; max-width: 780px; }
  .row { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
  .pill {
    padding: 11px 22px; border-radius: 999px;
    background: #fff0f7; border: 1.5px solid #ffd0e4;
    color: #c02f71; font-size: 19px; font-weight: 700;
  }
  .pill.solid {
    background: linear-gradient(135deg, #ff8fc0, #e34b8d);
    border-color: transparent; color: #fff;
    box-shadow: 0 10px 24px rgba(227,75,141,.3);
  }
  .bow { position: absolute; right: 56px; top: 44px; }
  .bow span { display: block; font-size: 24px; letter-spacing: 6px; color: #ff8fc0; font-weight: 700; }
  .code { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #b08fa1; margin-top: 24px; }
  .spark { position: absolute; color: #ff8fc0; font-size: 28px; opacity: .65; }
  .s1 { left: 40px; top: 116px; } .s2 { right: 84px; bottom: 74px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="spark s1">✦</div>
  <div class="spark s2">✧</div>
  <div class="card">
    <div class="bow"><span>✦ ♡ ✦</span></div>
    <div class="brand">
      <div class="mark">S</div>
      <div class="brand-text">PeterGTPS<em>/lua-script</em></div>
    </div>
    <h1>Script Lua <span>by @PeterGTPS</span></h1>
    <p>Koleksi script Lua Growtopia private server — aesthetic, rapi, siap copy &amp; download.</p>
    <div class="row">
      <span class="pill solid">1 Script</span>
      <span class="pill">★ 128 Stars</span>
      <span class="pill">♡ Free &amp; Open Source</span>
    </div>
    <div class="code">-- Script By: @PeterGTPS</div>
  </div>
</div>
<script>
  // Halaman ini didesain pas 1200x630 (ukuran gambar preview WhatsApp/Facebook).
  // Saat dibuka di layar kecil, stage diperkecil otomatis hanya untuk dilihat.
  const fit = () => {
    const s = Math.min(innerWidth / 1200, innerHeight / 630, 1);
    document.getElementById('stage').style.setProperty('--s', s);
  };
  fit();
  addEventListener('resize', fit);
</script>
</body>
</html>
